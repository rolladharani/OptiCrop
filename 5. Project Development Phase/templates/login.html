{% extends "layout.html" %}
{% block title %}Login – OptiCrop{% endblock %}

{% block content %}
<div style="min-height:calc(100vh - var(--nav-height)); display:flex; align-items:center; justify-content:center; padding:3rem 1.5rem;">
  <div style="width:100%; max-width:440px;">

    <div class="text-center mb-4">
      <div style="font-size:3rem; margin-bottom:0.5rem;">🌿</div>
      <h1 style="font-size:1.9rem; font-weight:800; letter-spacing:-0.5px;">Welcome Back</h1>
      <p style="color:var(--text-secondary); font-size:0.9rem; margin-top:0.35rem;">Sign in to your OptiCrop account</p>
    </div>

    <div class="card" style="padding:2.25rem;">
      <form method="POST" action="{{ url_for('login') }}" id="loginForm">
        <div class="form-group">
          <label class="form-label" for="username">Username</label>
          <div class="input-icon-wrapper">
            <i class="fa fa-user input-icon"></i>
            <input type="text" class="form-control" id="username" name="username" placeholder="Enter your username" required autocomplete="username">
          </div>
        </div>

        <div class="form-group">
          <label class="form-label" for="password">Password</label>
          <div class="input-icon-wrapper">
            <i class="fa fa-lock input-icon"></i>
            <input type="password" class="form-control" id="password" name="password" placeholder="Enter your password" required autocomplete="current-password">
          </div>
        </div>

        <button type="submit" class="btn btn-primary w-full mt-2" id="btn-login-submit" style="justify-content:center; padding:0.8rem;">
          <i class="fa fa-right-to-bracket"></i> Sign In
        </button>
      </form>

      <div class="divider"></div>

      <p class="text-center" style="font-size:0.88rem; color:var(--text-secondary);">
        Don't have an account?
        <a href="{{ url_for('register') }}" style="color:var(--accent-green); font-weight:600;" id="link-to-register">Create one here</a>
      </p>
    </div>

    <div class="text-center mt-3">
      <p style="font-size:0.8rem; color:var(--text-muted);">
        You can also use OptiCrop as a <a href="{{ url_for('findyourcrop') }}" style="color:var(--accent-teal);">guest user</a> — no account needed.
      </p>
    </div>

  </div>
</div>
{% endblock %}
